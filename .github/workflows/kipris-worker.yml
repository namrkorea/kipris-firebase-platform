name: KIPRIS Queue Worker

on:
  repository_dispatch:
    types: [kipris-job-created]
  workflow_dispatch:
  schedule:
    # 즉시 실행이 실패했을 때 남은 대기 작업을 보완 처리합니다.
    # 매시 정각 혼잡을 피하고 Actions 사용량을 줄이기 위해 매시 17분에 실행합니다.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: worker

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
      KIPRIS_SEARCH_URL: ${{ secrets.KIPRIS_SEARCH_URL }}
      KIPRIS_DETAIL_URL: ${{ secrets.KIPRIS_DETAIL_URL }}
      KIPRIS_PDF_URL: ${{ secrets.KIPRIS_PDF_URL }}
      PDF_BUCKET: patent-pdfs
      MAX_JOBS_PER_RUN: "5"
      WORKER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      POLL_SECONDS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install worker packages
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Process queued KIPRIS jobs
        run: python github_worker.py
