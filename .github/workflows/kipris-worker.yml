name: KIPRIS Queue Worker

on:
  repository_dispatch:
    types: [kipris-job-created]
  workflow_dispatch:
  schedule:
    # 즉시 실행이 실패하거나 누락됐을 때 남은 대기 작업을 보완 처리합니다.
    # 최대 대기시간을 줄이기 위해 5분마다 실행합니다.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: worker

    env:
      KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
      KIPRIS_SEARCH_URL: https://plus.kipris.or.kr/kipo-api/kipi/patUtiModInfoSearchSevice/getAdvancedSearch
      KIPRIS_DETAIL_URL: https://plus.kipris.or.kr/kipo-api/kipi/patUtiModInfoSearchSevice/getBibliographyDetailInfoSearch
      KIPRIS_PDF_URL: https://plus.kipris.or.kr/kipo-api/kipi/patUtiModInfoSearchSevice/getPubFullTextInfoSearch
      KIPRIS_REQUEST_INTERVAL: "1.2"
      KIPRIS_MAX_RETRIES: "4"

      FIREBASE_STORAGE_BUCKET: kipris-firebase-platform.firebasestorage.app

      PDF_BUCKET: patent-pdfs
      MAX_JOBS_PER_RUN: "5"
      WORKER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      POLL_SECONDS: "2"
      FETCH_DETAIL_XML: "false"
      PROGRESS_UPDATE_EVERY: "5"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Configure Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python -m json.tool "$RUNNER_TEMP/firebase-service-account.json" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install worker packages
        run: pip install --prefer-binary -r requirements.txt

      - name: Process queued KIPRIS jobs
        run: python github_worker.py
